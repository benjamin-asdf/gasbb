<!DOCTYPE html>

<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --fg: #1f1f1f; --muted: #6b6b6b; --line: #dadce0; --accent: #1a73e8; --err: #c5221f; --bg-in: #f8f9fa; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; color: var(--fg); display: flex; flex-direction: column; height: 100vh; }
  #log { flex: 1; overflow-y: auto; padding: 8px 10px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  .entry { border-bottom: 1px solid var(--line); padding: 6px 0; white-space: pre-wrap; word-break: break-word; }
  .in { color: var(--muted); }
  .out { color: var(--muted); font-style: italic; }
  .val { color: var(--fg); }
  .err { color: var(--err); }
  .ms { color: var(--muted); font-size: 11px; text-align: right; }
  form { border-top: 1px solid var(--line); padding: 8px 10px; background: var(--bg-in); }
  textarea { box-sizing: border-box; width: 100%; height: 90px; resize: vertical; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 6px; }
  .bar { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .bar span { color: var(--muted); font-size: 11px; flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
</style>

<body>
<div id="log"></div>
<form id="form">
  <textarea id="code" spellcheck="false" placeholder="(->> (gasbb.sheets/read-maps) (take 3))"></textarea>
  <div class="bar">
    <span id="hint">Ctrl+Enter to eval · defs: 0</span>
    <button type="button" id="reset" title="Forget definitions">Reset</button>
    <button type="submit" class="primary" id="eval">Eval</button>
  </div>
</form>
<script>
  // Every server call is a fresh Apps Script execution, so the REPL keeps
  // the top-level ns/require/def... forms of earlier evals here (the server
  // picks them out, r.keep) and replays them first.
  var defs = [];
  var currentNs = "user";
  var lastFailed = null;
  var log = document.getElementById("log");
  var code = document.getElementById("code");
  var btn = document.getElementById("eval");
  var hint = document.getElementById("hint");
  var resetBtn = document.getElementById("reset");

  function add(cls, text) {
    var d = document.createElement("div");
    d.className = cls;
    d.textContent = text;
    return d;
  }

  function evaluate() {
    var src = code.value;
    if (!src.trim() || btn.disabled) return;  // one eval at a time
    if (lastFailed && lastFailed.start + lastFailed.forms.length === defs.length &&
        lastFailed.forms.every(function (f) { return src.indexOf(f) >= 0; })) {
      defs.splice(lastFailed.start, lastFailed.forms.length);
    }
    lastFailed = null;
    var entry = document.createElement("div");
    entry.className = "entry";
    entry.appendChild(add("in", currentNs + "=> " + src));
    log.appendChild(entry);
    btn.disabled = true;
    resetBtn.disabled = true;
    var t0 = Date.now();
    google.script.run
      .withSuccessHandler(function (r) {
        btn.disabled = false;
        resetBtn.disabled = false;
        if (r.out) entry.appendChild(add("out", r.out.replace(/\n$/, "")));
        var kept = r.keep || [];
        // an input that failed halfway kept its first forms; remember them so
        // a fixed re-run of that input doesn't keep them a second time
        lastFailed = r.error && kept.length ? { start: defs.length, forms: kept } : null;
        defs = defs.concat(kept);
        currentNs = r.ns || currentNs;
        if (r.error) {
          entry.appendChild(add("err", r.error.message +
            (r.error.data ? "\n" + r.error.data : "") +
            (r.error.stacktrace ? "\n" + r.error.stacktrace : "")));
        } else {
          entry.appendChild(add("val", r.value));
          code.value = "";
        }
        entry.appendChild(add("ms", (Date.now() - t0) + " ms"));
        hint.textContent = "Ctrl+Enter to eval · defs: " + defs.length;
        log.scrollTop = log.scrollHeight;
      })
      .withFailureHandler(function (e) {
        btn.disabled = false;
        resetBtn.disabled = false;
        entry.appendChild(add("err", String(e && e.message || e)));
      })
      .gasbbReplEval(defs, src);
    log.scrollTop = log.scrollHeight;
  }

  document.getElementById("form").addEventListener("submit", function (e) { e.preventDefault(); evaluate(); });
  code.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); evaluate(); }
  });
  resetBtn.addEventListener("click", function () {
    defs = [];
    currentNs = "user";
    lastFailed = null;
    hint.textContent = "Ctrl+Enter to eval · defs: 0";
  });
  code.focus();
</script>
</body>
</html>
